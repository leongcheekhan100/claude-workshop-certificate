document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\n  font-display: swap;\n  src: url(\"4cc6d526-ed4f-4044-a8a7-00c59ffbcc1e\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Patrick Hand';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"734db4e7-8dcb-4f37-8592-6ab21ac4d204\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin */\n@font-face {\n  font-family: 'Permanent Marker';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"aa195729-6880-4b1c-8223-03d3d563e843\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n<style>\n  :root{\n    --coral: #E8623F;\n    --coral-deep: #c84e2e;\n    --ink: #1d1b1a;\n    --paper: #ffffff;\n    --pencil: #4a4744;\n    --marker: 'Permanent Marker', cursive;\n    --hand: 'Patrick Hand', cursive;\n    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;\n  }\n\n  *{ box-sizing: border-box; }\n\n  html,body{ margin:0; padding:0; background: var(--paper); color: var(--ink); }\n\n  body{\n    font-family: var(--sans);\n    -webkit-font-smoothing: antialiased;\n    text-rendering: optimizeLegibility;\n  }\n\n  /* ---------- HEADER BANNER ---------- */\n  /* Swap this .banner block for a full-width banner image of your own. */\n  .banner{\n    display:block;\n    width:100%;\n    height: clamp(150px, 26vw, 300px);\n    background-color: #f4efe9;\n    background-image: url('banner.jpg');\n    background-size: cover;\n    background-position: center;\n    background-repeat: no-repeat;\n    border-bottom: 3px solid var(--ink);\n    position: relative;\n    overflow:hidden;\n  }\n  .banner .banner-tag{\n    display:none;\n    position:absolute;\n    left:50%; top:50%;\n    transform: translate(-50%,-50%);\n    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;\n    font-size: clamp(11px, 1.4vw, 14px);\n    letter-spacing: .08em;\n    color:#9b9389;\n    background: rgba(255,255,255,.72);\n    padding: 6px 12px;\n    border: 1.5px dashed #b7ad9f;\n    border-radius: 4px;\n    white-space:nowrap;\n  }\n\n  /* ---------- PAGE WRAP ---------- */\n  .wrap{\n    max-width: 940px;\n    margin: 0 auto;\n    padding: 0 20px 80px;\n  }\n\n  .page-title{\n    font-family: var(--marker);\n    text-align:center;\n    line-height: 1.04;\n    margin: 34px auto 6px;\n    font-size: clamp(30px, 6.2vw, 58px);\n    font-weight: 400;\n    max-width: 14ch;\n    text-wrap: balance;\n  }\n  .page-title .ul{\n    position: relative;\n    white-space: nowrap;\n  }\n  .page-title .ul svg{\n    position:absolute; left:-2%; bottom: -0.26em; width:104%; height:0.4em;\n    overflow:visible;\n  }\n  .subscrawl{\n    font-family: var(--hand);\n    text-align:center;\n    color: var(--pencil);\n    font-size: clamp(15px, 2.4vw, 20px);\n    margin: 2px auto 30px;\n    transform: rotate(-1.2deg);\n  }\n\n  /* ---------- NAME INPUT BAR ---------- */\n  .namebar{\n    display:flex;\n    flex-direction: column;\n    align-items:center;\n    gap: 4px;\n    margin: 8px auto 18px;\n    position: relative;\n  }\n  .namebar .lbl{\n    font-family: var(--hand);\n    font-size: clamp(17px, 2.8vw, 23px);\n    color: var(--ink);\n    transform: rotate(-1.5deg);\n  }\n  .arrow-doodle{ width: 58px; height: 40px; display:block; margin: -2px auto 2px; color: var(--coral); }\n  .name-input{\n    font-family: var(--hand);\n    font-size: clamp(20px, 4vw, 30px);\n    text-align:center;\n    color: var(--ink);\n    background: #fff;\n    border: none;\n    outline: none;\n    padding: 10px 22px 6px;\n    width: min(440px, 86vw);\n    border-bottom: 3px solid var(--ink);\n    caret-color: var(--coral);\n  }\n  .name-input::placeholder{ color:#c7c1ba; }\n\n  /* ---------- CERTIFICATE ---------- */\n  .cert-stage{\n    margin: 26px auto 0;\n    width: 100%;\n  }\n  #cert{\n    display:block;\n    width: 100%;\n    height: auto;\n    /* soft hand-placed shadow */\n    filter: drop-shadow(7px 9px 0 rgba(29,27,26,0.10));\n  }\n\n  /* ---------- DOWNLOAD BUTTON ---------- */\n  .actions{\n    display:flex;\n    flex-direction:column;\n    align-items:center;\n    gap: 12px;\n    margin-top: 34px;\n  }\n  .dl-btn{\n    font-family: var(--marker);\n    font-size: clamp(17px, 3vw, 22px);\n    color:#fff;\n    background: var(--coral);\n    border: none;\n    padding: 16px 30px 13px;\n    cursor: pointer;\n    position: relative;\n    border-radius: 2px;\n    box-shadow: 4px 5px 0 var(--ink);\n    transition: transform .08s ease, box-shadow .08s ease;\n    letter-spacing: .01em;\n  }\n  .dl-btn:hover{ transform: translate(-1px,-1px); box-shadow: 6px 7px 0 var(--ink); }\n  .dl-btn:active{ transform: translate(3px,4px); box-shadow: 1px 1px 0 var(--ink); }\n  .dl-note{\n    font-family: var(--hand);\n    color: var(--pencil);\n    font-size: clamp(13px, 2.2vw, 16px);\n    transform: rotate(-0.8deg);\n    text-align:center;\n  }\n  .footscrawl{\n    font-family: var(--hand);\n    text-align:center;\n    color:#a59d93;\n    font-size: 14px;\n    margin-top: 48px;\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n  \n\n  <!-- ===== HEADER BANNER =====\n       To use your own photo, replace this whole .banner DIV with an image tag:\n       a full-width img element pointing at your JPG. -->\n  <div class=\"banner\">\n    <span class=\"banner-tag\">[ banner photo — drop your JPG here, full-width ]<\u002Fspan>\n  <\u002Fdiv>\n\n  <div class=\"wrap\">\n\n    <!-- ===== PAGE TITLE ===== -->\n    <h1 class=\"page-title\">Unofficial Claude <span class=\"ul\">Workshop<svg viewBox=\"0 0 200 12\" preserveAspectRatio=\"none\"><path d=\"M3 8 C 50 3, 120 11, 197 5\" fill=\"none\" stroke=\"#E8623F\" stroke-width=\"4\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan> Certificate<\u002Fh1>\n    <p class=\"subscrawl\">(yes, it's unofficial — but you totally earned it)<\u002Fp>\n\n    <!-- ===== NAME INPUT BAR ===== -->\n    <div class=\"namebar\">\n      <span class=\"lbl\">Type your name here<\u002Fspan>\n      <svg class=\"arrow-doodle\" viewBox=\"0 0 58 40\" fill=\"none\">\n        <path d=\"M30 3 C 12 6, 8 20, 26 30\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath>\n        <path d=\"M26 30 L 18 25 M26 30 L 30 21\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath>\n      <\u002Fsvg>\n      <input id=\"nameInput\" class=\"name-input\" type=\"text\" maxlength=\"34\" autocomplete=\"off\" placeholder=\"your name\" aria-label=\"Your name\">\n    <\u002Fdiv>\n\n    <!-- ===== CERTIFICATE (rendered to canvas for crisp PNG export) ===== -->\n    <div class=\"cert-stage\">\n      <canvas id=\"cert\" role=\"img\" aria-label=\"Your certificate preview\"><\u002Fcanvas>\n    <\u002Fdiv>\n\n    <!-- ===== DOWNLOAD ===== -->\n    <div class=\"actions\">\n      <button id=\"dlBtn\" class=\"dl-btn\">Download my certificate (PNG) ⬇<\u002Fbutton>\n      <span class=\"dl-note\">downloads just the certificate — not this whole page<\u002Fspan>\n    <\u002Fdiv>\n\n    <p class=\"footscrawl\">made with crooked lines &amp; good intentions<\u002Fp>\n  <\u002Fdiv>\n\n<script>\n(function(){\n  \"use strict\";\n\n  // ---------------- canvas setup ----------------\n  var W = 1040, H = 720, RS = 2; // logical size + retina scale\n  var canvas = document.getElementById('cert');\n  var ctx = canvas.getContext('2d');\n  canvas.width = W * RS;\n  canvas.height = H * RS;\n\n  var CORAL = '#E8623F', CORAL_DEEP = '#c84e2e', INK = '#1d1b1a', PENCIL = '#4a4744';\n\n  var nameInput = document.getElementById('nameInput');\n  var currentName = '';\n\n  // ---------------- deterministic hand-jitter ----------------\n  // Precompute once so the wobble doesn't shimmer on every keystroke.\n  function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }\n  var rnd = mulberry32(20260604);\n  function jit(amp){ return (rnd() - 0.5) * 2 * amp; }\n\n  function makeWobble(){\n    return {\n      tl:[jit(3), jit(3)], tr:[jit(3), jit(3)], br:[jit(3), jit(3)], bl:[jit(3), jit(3)],\n      bowT: jit(5), bowR: jit(5), bowB: jit(5), bowL: jit(5)\n    };\n  }\n  var wobOuter = makeWobble();\n  var wobInner = makeWobble();\n  var underlineSeed = [jit(2), jit(2.5), jit(2), jit(2.5), jit(2)];\n\n  function wobbleRect(x, y, w, h, s){\n    var TL=[x+s.tl[0], y+s.tl[1]], TR=[x+w+s.tr[0], y+s.tr[1]],\n        BR=[x+w+s.br[0], y+h+s.br[1]], BL=[x+s.bl[0], y+h+s.bl[1]];\n    ctx.beginPath();\n    ctx.moveTo(TL[0], TL[1]);\n    ctx.quadraticCurveTo((TL[0]+TR[0])/2, (TL[1]+TR[1])/2 + s.bowT, TR[0], TR[1]);\n    ctx.quadraticCurveTo((TR[0]+BR[0])/2 + s.bowR, (TR[1]+BR[1])/2, BR[0], BR[1]);\n    ctx.quadraticCurveTo((BR[0]+BL[0])/2, (BR[1]+BL[1])/2 + s.bowB, BL[0], BL[1]);\n    ctx.quadraticCurveTo((BL[0]+TL[0])/2 + s.bowL, (BL[1]+TL[1])/2, TL[0], TL[1]);\n    ctx.closePath();\n  }\n\n  function wobbleLine(x1, y, x2, seed){\n    ctx.beginPath();\n    ctx.moveTo(x1, y + seed[0]);\n    var span = x2 - x1;\n    ctx.quadraticCurveTo(x1 + span*0.25, y + seed[1], x1 + span*0.5, y + seed[2]);\n    ctx.quadraticCurveTo(x1 + span*0.75, y + seed[3], x2, y + seed[4]);\n    ctx.stroke();\n  }\n\n  // ---------------- pixel mascot ----------------\n  // friendly orange \"space-invader\": squarish body, 2 black square eyes,\n  // 2 side bumps, 4 stubby legs.  O = coral body, X = black eye, '.' = empty\n  var MASCOT = [\n    \"..O.....O..\",\n    \"...O...O...\",\n    \"..OOOOOOO..\",\n    \".OOOOOOOOO.\",\n    \"OOOOOOOOOOO\",\n    \"OOXXOOOXXOO\",\n    \"OOXXOOOXXOO\",\n    \"OOOOOOOOOOO\",\n    \"OOOOOOOOOOO\",\n    \"OO.OOOOO.OO\",\n    \"O.O.O.O.O.O\"\n  ];\n  function drawMascot(cx, cy, px){\n    var cols = MASCOT[0].length, rows = MASCOT.length;\n    var ox = cx - (cols*px)/2, oy = cy - (rows*px)/2;\n    for(var r=0; r<rows; r++){\n      for(var c=0; c<cols; c++){\n        var ch = MASCOT[r][c];\n        if(ch === '.') continue;\n        ctx.fillStyle = (ch === 'X') ? '#1d1b1a' : CORAL;\n        // tiny per-pixel jitter for hand-placed feel\n        var jx = ((r*7+c*13)%3 - 1) * 0.5;\n        var jy = ((r*5+c*11)%3 - 1) * 0.5;\n        ctx.fillRect(Math.round(ox + c*px + jx), Math.round(oy + r*px + jy), Math.ceil(px), Math.ceil(px));\n      }\n    }\n  }\n\n  function setFont(weight, size, family){ ctx.font = weight + ' ' + size + 'px ' + family; }\n\n  // fit a string to a max width by shrinking font size\n  function fitFont(text, weight, startSize, family, maxW, minSize){\n    var size = startSize;\n    setFont(weight, size, family);\n    while(ctx.measureText(text).width > maxW && size > minSize){\n      size -= 1;\n      setFont(weight, size, family);\n    }\n    return size;\n  }\n\n  // ---------------- main render ----------------\n  function render(){\n    ctx.setTransform(RS, 0, 0, RS, 0, 0);\n    ctx.clearRect(0, 0, W, H);\n\n    // paper\n    ctx.fillStyle = '#fff';\n    ctx.fillRect(0, 0, W, H);\n\n    ctx.textAlign = 'center';\n    ctx.textBaseline = 'alphabetic';\n    ctx.lineJoin = 'round';\n    ctx.lineCap = 'round';\n\n    // ----- double wobbly coral border -----\n    ctx.strokeStyle = CORAL;\n    ctx.lineWidth = 6;\n    wobbleRect(34, 34, W-68, H-68, wobOuter);\n    ctx.stroke();\n    ctx.lineWidth = 3;\n    wobbleRect(52, 52, W-104, H-104, wobInner);\n    ctx.stroke();\n\n    var midX = W/2;\n\n    // ----- title -----\n    ctx.fillStyle = INK;\n    var tSize = fitFont('Unofficial Claude Workshop Certificate', '400', 44, \"'Permanent Marker', cursive\", W-220, 26);\n    ctx.fillText('Unofficial Claude Workshop Certificate', midX, 132);\n\n    // little coral tick under title\n    ctx.strokeStyle = CORAL;\n    ctx.lineWidth = 3.5;\n    wobbleLine(midX-150, 150, midX+150, [jit(1.5),jit(2),jit(1.5),jit(2),jit(1.5)]);\n\n    // ----- this certifies that -----\n    ctx.fillStyle = PENCIL;\n    setFont('400', 23, \"var-sans\");\n    ctx.font = \"400 23px \" + sansStack();\n    ctx.fillText('This certifies that', midX, 232);\n\n    // ----- name (big hand-lettered) -----\n    var nm = currentName.trim() ? currentName.trim() : '[ your name ]';\n    var isPlaceholder = !currentName.trim();\n    ctx.fillStyle = isPlaceholder ? '#c7c1ba' : INK;\n    var nSize = fitFont(nm, '700', 86, \"'Caveat', cursive\", W-260, 34);\n    ctx.fillText(nm, midX, 322);\n\n    // coral underline doodle beneath the name\n    var nmeasure = (function(){ setFont('700', nSize, \"'Caveat', cursive\"); return ctx.measureText(nm).width; })();\n    var half = Math.min(Math.max(nmHalfWidth(nm, nSize), 90), (W-220)/2);\n    ctx.strokeStyle = isPlaceholder ? '#ddd6cd' : CORAL;\n    ctx.lineWidth = 4;\n    wobbleLine(midX - half, 348, midX + half, underlineSeed);\n\n    // ----- completed line -----\n    ctx.fillStyle = INK;\n    ctx.font = \"400 24px \" + sansStack();\n    ctx.fillText('has successfully completed the Claude Workshop', midX, 416);\n\n    // ----- date -----\n    ctx.fillStyle = PENCIL;\n    ctx.font = \"400 19px \" + sansStack();\n    ctx.fillText('4 June 2026', midX, 470);\n\n    // ===== bottom row: signature (left) + mascot seal (right) =====\n    var sigX = 300, seY = 600;\n    // signature line\n    ctx.strokeStyle = INK;\n    ctx.lineWidth = 2.5;\n    wobbleLine(sigX-130, seY, sigX+130, [jit(1),jit(1.5),jit(1),jit(1.5),jit(1)]);\n    // signature script above the line\n    ctx.fillStyle = INK;\n    ctx.font = \"700 42px 'Dancing Script', cursive\";\n    ctx.fillText('CK Leong', sigX, seY-6);\n    // role beneath\n    ctx.fillStyle = PENCIL;\n    ctx.font = \"400 17px \" + sansStack();\n    ctx.fillText('Instructor', sigX, seY+28);\n\n    // mascot seal (right)\n    var mx = 745, my = 575;\n    drawMascot(mx, my, 12);\n    // hand caption under mascot\n    ctx.fillStyle = '#b3aaa0';\n    ctx.font = \"400 15px 'Patrick Hand', cursive\";\n    ctx.fillText('100% unofficial seal', mx, my+82);\n  }\n\n  function sansStack(){\n    return \"-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif\";\n  }\n\n  // estimate half-width of name text for the underline (uses current ctx font)\n  function nmHalfWidth(text, size){\n    setFont('700', size, \"'Caveat', cursive\");\n    return ctx.measureText(text).width/2 + 14;\n  }\n\n  // ---------------- interactions ----------------\n  nameInput.addEventListener('input', function(){\n    currentName = nameInput.value;\n    render();\n  });\n\n  document.getElementById('dlBtn').addEventListener('click', function(){\n    render(); // ensure fresh\n    var url = canvas.toDataURL('image/png');\n    var a = document.createElement('a');\n    var safe = (currentName.trim() || 'certificate').replace(/[^a-z0-9]+/gi, '-').replace(/^-+|-+$/g,'').toLowerCase();\n    a.download = 'claude-workshop-certificate-' + (safe || 'certificate') + '.png';\n    a.href = url;\n    document.body.appendChild(a);\n    a.click();\n    document.body.removeChild(a);\n  });\n\n  // ---------------- font-aware first paint ----------------\n  function go(){ render(); }\n  if(document.fonts && document.fonts.ready){\n    Promise.all([\n      document.fonts.load(\"400 44px 'Permanent Marker'\"),\n      document.fonts.load(\"700 86px 'Caveat'\"),\n      document.fonts.load(\"700 42px 'Dancing Script'\"),\n      document.fonts.load(\"400 17px 'Patrick Hand'\")\n    ]).then(go).catch(go);\n    document.fonts.ready.then(go);\n  }\n  go();\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
